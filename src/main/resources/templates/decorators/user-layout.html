<!DOCTYPE html>
<html lang="vi" xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title><sitemesh:write property="title" default="OneShop User"/></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <sitemesh:write property="head"/>
  <style>
    body {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>
  <!-- Header for pages without sidebar -->
  <div th:replace="fragments/user-header :: user-header"></div>
  
  <main>
    <sitemesh:write property="body"/>
  </main>
  
  <div th:replace="fragments/user-footer :: user-footer"></div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
