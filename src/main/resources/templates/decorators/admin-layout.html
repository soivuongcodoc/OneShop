<!DOCTYPE html>
<html lang="vi" xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title><sitemesh:write property="title" default="OneShop Admin"/></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #eef2f7;
      font-family: 'Segoe UI', sans-serif;
    }
    .sidebar {
      width: 240px;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #0d6efd;
    }
    .sidebar a {
      color: #e9ecef;
      display: block;
      padding: 12px 20px;
      text-decoration: none;
      font-weight: 500;
    }
    .sidebar a:hover, .sidebar a.active {
      background-color: #0b5ed7;
      color: #fff;
    }
    main {
      margin-left: 240px;
      padding: 30px;
    }
    .content-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 25px;
    }
    footer {
      margin-left: 240px;
      background-color: #fff;
      color: #6c757d;
      text-align: center;
      padding: 12px 0;
      border-top: 1px solid #dee2e6;
    }
  </style>
</head>
<body>

<!-- Header -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" style="margin-left:240px;">
  <div class="container-fluid justify-content-end">
    <span class="text-light me-3"><i class="bi bi-person-circle"></i> Quản trị viên</span>
  </div>
  </nav>
<div style="height:56px;"></div>

<!-- Sidebar -->
<nav class="sidebar d-flex flex-column">
  <div class="text-center py-3 text-light fw-bold fs-5 border-bottom border-primary-subtle">
    🧭 OneShop Admin
  </div>
  <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
  <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a>
  <a th:href="@{/admin/shop-requests}"><i class="bi bi-shop-window me-2"></i>Duyệt Shop</a>
  <a th:href="@{/admin/categories}"><i class="bi bi-tags me-2"></i>Danh mục</a>
  <a th:href="@{/admin/products}"><i class="bi bi-box-seam me-2"></i>Sản phẩm</a>
  <a th:href="@{/admin/promotions}"><i class="bi bi-percent me-2"></i>Khuyến mãi</a>
  <div class="mt-auto border-top border-primary-subtle">
    <a href="#" class="text-light" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a>
  </div>
  </nav>

<!-- Nội dung -->
<main>
  <div class="content-card">
    <sitemesh:write property="body"/>
  </div>
</main>

<!-- Footer -->
<footer>
  <p class="mb-0">&copy; 2025 OneShop Admin Dashboard | Nhóm 4</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/auth-guard.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
