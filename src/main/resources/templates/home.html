<!DOCTYPE html>
<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8" %>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang chủ - OneShop</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <!-- Google Fonts: Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
 <style>
    :root {
      --primary-color: #e63946;
      --primary-hover: #d00000;
      --text-dark: #2d3436;
      --text-light: #636e72;
      --bg-light: #f8f9fa;
      --border-color: #dee2e6;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.1);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
      --radius: 12px;
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f1f3f5;
      color: var(--text-dark);
    }

    /* Header */
    .header {
      text-align: center;
      padding: 2.5rem 1rem;
      background: linear-gradient(135deg, #ff6b6b, var(--primary-color));
      color: white;
      border-bottom-left-radius: var(--radius);
      border-bottom-right-radius: var(--radius);
      box-shadow: var(--shadow-md);
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
    }

    .header small {
      font-size: 0.9rem;
      opacity: 0.85;
    }

    /* Container */
    .products-section {
      padding: 2rem 1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Search Section */
    .search-container {
      background: white;
      padding: 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 2rem;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      color: #888;
      z-index: 2;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.8rem;
      border: 2px solid var(--border-color);
      border-radius: 50px;
      font-size: 1rem;
      transition: var(--transition);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.15);
    }

    .search-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-weight: 500;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 0 2px 4px rgba(230, 57, 70, 0.2);
    }

    .search-button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(230, 57, 70, 0.3);
    }
    .search-button:active {
        transform: translateY(0);
    }
    .clear-button {
      position: absolute;
      right: 1rem;
      color: #999;
      font-size: 1.2rem;
      text-decoration: none;
      transition: var(--transition);
    }

    .clear-button:hover {
      color: var(--primary-color);
    }

    .search-result-info {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      background-color: #e3f2fd;
      border-left: 4px solid #2196f3;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      color: #1565c0;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-light);
    }

    .empty-state i {
      font-size: 4rem;
      color: #ced4da;
      margin-bottom: 1rem;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    /* Product Grid */
    .product-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-md);
    }

    .product-image-wrapper {
      position: relative;
      overflow: hidden;
      background: #f8f9fa;
    }

    .product-rank {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--primary-color);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-image {
      transform: scale(1.08);
    }

    .product-info {
      padding: 1rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .product-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }

    .product-sold {
      color: var(--text-light);
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: auto;
    }

    .product-sold i {
      color: #ff6b6b;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 2.2rem;
      }
      .search-form {
        flex-direction: column;
      }
      .search-button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
  <!-- Header -->
  <div class="header">
    <h1>OneShop</h1>
    <p>Sản Phẩm Bán Chạy Nhất</p>
  </div>

  <!-- Products Section -->
  <div class="container products-section">
    <!-- Search Section -->
    <div class="row mb-4">
      <div class="col-12">
        <div class="search-container">
          <form action="/home" method="get" class="d-flex gap-2">
            <div class="search-input-wrapper">
              <i class="fas fa-search search-icon"></i>
              <input
                type="text"
                name="search"
                class="search-input"
                placeholder="Tìm kiếm sản phẩm..."
                th:value="${searchQuery}"
                autocomplete="off"
              />
              <a
                href="/home"
                class="clear-button"
                th:if="${searchQuery != null && searchQuery != ''}"
                title="Xóa tìm kiếm"
              >
                <i class="fas fa-times"></i>
              </a>
            </div>
            <button type="submit" class="search-button">
              <i class="fas fa-search"></i>
              <span class="d-none d-md-inline">Tìm kiếm</span>
            </button>
          </form>

          <!-- Search Result Info -->
          <div
            class="search-result-info"
            th:if="${searchQuery != null && searchQuery != ''}"
          >
            <i class="fas fa-info-circle"></i>
            Tìm thấy <strong th:text="${searchResultCount}">0</strong> sản phẩm với từ khóa
            "<strong th:text="${searchQuery}">...</strong>"
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Empty State -->
      <div class="col-12" th:if="${products == null || products.size() == 0}">
        <div class="empty-state">
          <i class="fas fa-box-open"></i>
          <h3>Chưa có sản phẩm nào</h3>
          <p class="text-muted">Vui lòng quay lại sau</p>
        </div>
      </div>

      <!-- Product Grid -->
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" th:unless="${products == null || products.size() == 0}">
        <div class="col" th:each="product, iterStat : ${products}">
          <a th:href="@{'/user/product/' + ${product.id}}" class="text-decoration-none">
            <div class="product-card">
              <div class="product-image-wrapper">
                <!-- <div class="product-rank" th:text="${iterStat.count}">1</div> -->
                <img
                  style="width: 100%; height: 250px; object-fit: cover;"
                  th:src="@{${product.imageUrl ?: 'https://via.placeholder.com/300?text=No+Image'}}"
                  th:alt="${product.name}"
                  class="product-image"
                  onerror="this.onerror=null;this.src='https://via.placeholder.com/300?text=No+Image';"
                />
              </div>
              <div class="product-info">
                <div class="product-name" th:text="${product.name}">
                  Tên sản phẩm dài để kiểm tra hiển thị trên nhiều dòng
                </div>
                <div class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                  0 ₫
                </div>
                <div class="product-sold">
                  <i class="fas fa-fire"></i>
                  Đã bán <span th:text="${product.sold}">0</span>
                </div>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script>
    // Hiệu ứng loading khi tìm kiếm
    document.querySelector('.search-form').addEventListener('submit', function() {
      const btn = this.querySelector('.search-button');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tìm...';
      btn.disabled = true;

      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }, 1000);
    });

    // Xóa tìm kiếm khi nhấn nút x
    document.querySelectorAll('.clear-button').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = '/home';
      });
    });
  </script>
</body>
</html>
