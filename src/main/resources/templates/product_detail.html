<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm</title>

    <!-- Google Fonts - Hỗ trợ tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          'Roboto', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div class="container my-4">
      <div class="row">
        <div class="col-md-5">
          <img
            class="img-fluid rounded"
            th:src="${product.imageUrl} != null ? ${product.imageUrl} : '/uploads/user/default.png'"
            alt="product"
          />
        </div>
        <div class="col-md-7">
          <h3 th:text="${product.name}">Tên sản phẩm</h3>
          <p class="text-muted" th:text="${product.description}">Mô tả</p>
          <div class="mb-3">
            <span class="h5" th:text="${product.price}"></span>
          </div>
          <form
            th:action="@{'/user/cart/add/' + ${product.id}}"
            method="post"
            class="d-flex gap-2"
          >
            <input
              type="number"
              name="qty"
              class="form-control"
              min="1"
              value="1"
              style="max-width: 120px"
            />
            <button class="btn btn-primary">Thêm vào giỏ</button>
          </form>
        </div>
      </div>

      <hr class="my-4" />
      <h5>Thêm đánh giá</h5>
      <form
        th:action="@{/user/reviews/add}"
        method="post"
        enctype="multipart/form-data"
        class="mb-4"
      >
        <input type="hidden" name="productId" th:value="${product.id}" />
        <div class="mb-2">
          <label class="form-label">Đánh giá (1-5)</label>
          <input
            type="number"
            name="rating"
            class="form-control"
            min="1"
            max="5"
            required
          />
        </div>
        <div class="mb-2">
          <label class="form-label">Nhận xét (tối thiểu 50 ký tự)</label>
          <textarea
            name="comment"
            class="form-control"
            rows="4"
            minlength="50"
            required
          ></textarea>
        </div>
        <div class="mb-2">
          <label class="form-label">Ảnh/Video</label>
          <input type="file" name="media" class="form-control" />
        </div>
        <button class="btn btn-success">Gửi đánh giá</button>
      </form>

      <h5>Đánh giá gần đây</h5>
      <div
        th:if="${reviews != null}"
        th:each="rv : ${reviews}"
        class="card mb-2"
      >
        <div class="card-body">
          <div class="d-flex justify-content-between">
            <div>
              <strong th:text="'Khách #' + ${rv.userId}"></strong>
              <div>
                <span th:text="${rv.rating} + '/5'"></span>
              </div>
              <div th:text="${rv.comment}"></div>
              <div th:if="${rv.mediaUrl}">
                <img
                  th:if="${#strings.endsWith(rv.mediaUrl,'.png') || #strings.endsWith(rv.mediaUrl,'.jpg') || #strings.endsWith(rv.mediaUrl,'.jpeg') || #strings.endsWith(rv.mediaUrl,'.webp')}"
                  th:src="${rv.mediaUrl}"
                  class="img-thumbnail mt-2"
                  style="max-width: 200px"
                />
                <video
                  th:if="${#strings.endsWith(rv.mediaUrl,'.mp4') || #strings.endsWith(rv.mediaUrl,'.webm')}"
                  th:src="${rv.mediaUrl}"
                  controls
                  class="mt-2"
                  style="max-width: 300px"
                ></video>
              </div>
            </div>
            <small
              class="text-muted"
              th:text="${#temporals.format(rv.createdAt, 'dd/MM/yyyy')}"
            ></small>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
