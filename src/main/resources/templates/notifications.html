<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
      sitemesh:decorate="~{decorators/main}">
<head>
    <title>Thông báo - OneShop</title>
</head>
<body>
<div class="container my-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold"><i class="bi bi-bell"></i> Thông báo của bạn</h2>
                <button th:if="${unreadCount > 0}" 
                        onclick="markAllAsRead()" 
                        class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-check-all"></i> Đánh dấu tất cả đã đọc
                </button>
            </div>
            
            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                <i class="bi bi-bell-slash" style="font-size: 4rem; color: #ccc;"></i>
                <h4 class="mt-3 text-muted">Chưa có thông báo nào</h4>
                <p class="text-muted">Các thông báo quan trọng sẽ hiển thị ở đây</p>
                <a th:href="@{/user/dashboard}" class="btn btn-primary mt-3">
                    <i class="bi bi-arrow-left"></i> Quay lại trang chủ
                </a>
            </div>
            
            <!-- Notifications List -->
            <div th:if="${!#lists.isEmpty(notifications)}">
                <div th:each="notif : ${notifications}" 
                     class="card mb-3 border-start border-4" 
                     th:classappend="${notif.read} ? 'border-secondary' : 'border-primary bg-light'">
                    <div class="card-body">
                        <div class="d-flex">
                            <div class="flex-grow-1">
                                <!-- Icon based on type -->
                                <h5 class="card-title mb-2">
                                    <i th:class="${notif.type.name() == 'NEW_ORDER'} ? 'bi bi-cart-check text-success' : 
                                                 (${notif.type.name() == 'ORDER_CONFIRMED'} ? 'bi bi-check-circle text-info' : 
                                                 (${notif.type.name() == 'ORDER_CANCELLED'} ? 'bi bi-x-circle text-danger' : 
                                                 (${notif.type.name() == 'PRODUCT_DELETED'} ? 'bi bi-trash text-danger' : 
                                                 (${notif.type.name() == 'SHOP_REQUEST_APPROVED'} ? 'bi bi-shop-window text-success' : 
                                                 (${notif.type.name() == 'SHOP_REQUEST_REJECTED'} ? 'bi bi-x-octagon text-danger' : 
                                                 'bi bi-info-circle text-warning')))))"></i>
                                    <span th:text="${notif.title != null ? notif.title : 'Thông báo'}">Thông báo</span>
                                    <span th:if="${!notif.read}" class="badge bg-primary ms-2">Mới</span>
                                </h5>
                                <p class="card-text" th:text="${notif.message}">Nội dung thông báo</p>
                                <small class="text-muted">
                                    <i class="bi bi-clock"></i> 
                                    <span th:text="${#temporals.format(notif.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2025 10:00</span>
                                </small>
                            </div>
                            <div class="ms-3">
                                <button th:if="${!notif.read}" 
                                        class="btn btn-sm btn-outline-primary mb-2" 
                                        th:onclick="'markAsRead(' + ${notif.id} + ')'">
                                    <i class="bi bi-check"></i>
                                </button>
                                <a th:if="${notif.link != null}" 
                                   th:href="@{${notif.link}}" 
                                   class="btn btn-sm btn-primary">
                                    <i class="bi bi-arrow-right"></i> Xem
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
function markAsRead(id) {
    fetch('/notifications/' + id + '/read', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    }).then(response => {
        if (response.ok) {
            location.reload();
        }
    });
}

function markAllAsRead() {
    fetch('/notifications/read-all', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        }
    }).then(response => {
        if (response.ok) {
            location.reload();
        }
    });
}
</script>

</body>
</html>
