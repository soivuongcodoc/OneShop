<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
  sitemesh:decorate="~{decorators/main}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Top 20 - OneShop</title>
    <style>
      .nav-tabs .nav-link {
        color: #495057;
        border: 2px solid transparent;
        border-radius: 10px 10px 0 0;
        padding: 12px 24px;
        font-weight: 600;
      }
      .nav-tabs .nav-link:hover {
        border-color: #dee2e6;
        background: #f8f9fa;
      }
      .nav-tabs .nav-link.active {
        color: #0d6efd;
        background: #fff;
        border-color: #dee2e6 #dee2e6 #fff;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 30px 20px;
        row-gap: 40px;
        margin-top: 30px;
      }
      .product-card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .product-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
      }
      .product-name {
        font-weight: 600;
        margin: 10px 0;
        font-size: 14px;
        height: 40px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .product-price {
        color: #dc3545;
        font-weight: bold;
        font-size: 16px;
        margin: 10px 0;
      }
      .product-stats {
        font-size: 12px;
        color: #6c757d;
        margin-top: 8px;
      }
      .badge-custom {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 600;
      }

      /* Responsive for Back Button */
      @media (max-width: 768px) {
        .d-flex.justify-content-between.align-items-center {
          flex-direction: column;
          align-items: flex-start !important;
        }
        .d-flex.justify-content-between .btn {
          margin-top: 1rem;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <!-- Header -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h2 class="fw-bold mb-2">🏆 Top 20 Sản Phẩm</h2>
            <p class="text-muted mb-0">
              Khám phá những sản phẩm tốt nhất trong từng danh mục
            </p>
          </div>
          <a href="/user/dashboard" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard
          </a>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <ul class="nav nav-tabs" role="tablist">
        <li class="nav-item">
          <a
            class="nav-link"
            th:classappend="${activeTab == 'new'} ? 'active'"
            th:href="@{/user/top20(type='new')}"
          >
            <i class="bi bi-sparkles"></i> Sản phẩm mới
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            th:classappend="${activeTab == 'bestselling'} ? 'active'"
            th:href="@{/user/top20(type='bestselling')}"
          >
            <i class="bi bi-fire"></i> Bán chạy
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            th:classappend="${activeTab == 'toprated'} ? 'active'"
            th:href="@{/user/top20(type='toprated')}"
          >
            <i class="bi bi-star-fill"></i> Đánh giá cao
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            th:classappend="${activeTab == 'mostfavorited'} ? 'active'"
            th:href="@{/user/top20(type='mostfavorited')}"
          >
            <i class="bi bi-heart-fill"></i> Yêu thích
          </a>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content border border-top-0 rounded-bottom p-4">
        <!-- Current Tab Title -->
        <div class="mb-3">
          <h4 th:text="${title}">Sản phẩm</h4>
          <p class="text-muted" th:text="'Hiển thị 20 ' + ${title} + ' nhất'">
            Hiển thị 20 sản phẩm
          </p>
        </div>

        <!-- Empty State -->
        <div
          th:if="${products == null || products.size() == 0}"
          class="text-center py-5"
        >
          <i class="bi bi-inbox" style="font-size: 4rem; color: #dee2e6"></i>
          <p class="text-muted mt-3">Chưa có sản phẩm nào</p>
        </div>

        <!-- Products Grid -->
        <div
          class="product-grid"
          th:if="${products != null && products.size() > 0}"
        >
          <div class="product-card" th:each="p : ${products}">
            <!-- Badge Category -->
            <div class="mb-2">
              <span
                class="badge bg-info badge-custom"
                th:text="${p.category.name}"
              >
                Category
              </span>
            </div>

            <a th:href="@{'/product/' + ${p.id}}" class="text-decoration-none">
              <img
                th:if="${p.imageUrl} != null"
                th:src="${p.imageUrl}"
                th:alt="${p.name}"
              />
              <img
                th:if="${p.imageUrl} == null"
                src="/images/no-image.png"
                alt="No image"
              />
              <div class="product-name" th:text="${p.name}">Product Name</div>
            </a>

            <div
              class="product-price"
              th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'"
            >
              0₫
            </div>

            <!-- Product Stats -->
            <div class="product-stats">
              <span th:if="${activeTab == 'bestselling'}">
                <i class="bi bi-bag-check"></i>
                Đã bán:
                <strong th:text="${p.sold}">0</strong>
              </span>
              <span th:if="${activeTab == 'toprated'}">
                <i class="bi bi-star-fill text-warning"></i>
                <strong th:text="${p.rating}">0</strong>
                / 5
              </span>
              <span th:if="${activeTab == 'new'}">
                <i class="bi bi-calendar3"></i>
                <span th:text="${#temporals.format(p.createdAt, 'dd/MM/yyyy')}">
                  01/01/2025
                </span>
              </span>
            </div>

            <form
              th:action="@{'/user/cart/add/' + ${p.id}}"
              method="post"
              class="mt-2"
            >
              <div class="input-group input-group-sm">
                <input
                  type="number"
                  name="qty"
                  value="1"
                  min="1"
                  class="form-control"
                  style="max-width: 70px"
                />
                <button type="submit" class="btn btn-success flex-grow-1">
                  <i class="bi bi-cart-plus"></i> Thêm vào giỏ
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Pagination -->
        <nav
          class="d-flex justify-content-center mt-5"
          th:if="${totalPages > 1}"
        >
          <ul class="pagination">
            <li
              class="page-item"
              th:classappend="${currentPage == 0} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="@{/user/top20(type=${type}, page=${currentPage - 1})}"
              >
                Trước
              </a>
            </li>

            <li
              th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              class="page-item"
              th:classappend="${i == currentPage} ? 'active'"
            >
              <a
                class="page-link"
                th:href="@{/user/top20(type=${type}, page=${i})}"
                th:text="${i + 1}"
              >
                1
              </a>
            </li>

            <li
              class="page-item"
              th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="@{/user/top20(type=${type}, page=${currentPage + 1})}"
              >
                Sau
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </body>
</html>
