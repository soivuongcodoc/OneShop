<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
  sitemesh:decorate="~{decorators/user-layout}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Sản phẩm - OneShop</title>
    <style>
      .sidebar {
        position: fixed;
        top: 76px; /* Start below header */
        left: 0;
        height: calc(100vh - 76px);
        width: 250px;
        background-color: #343a40;
        color: white;
        overflow-y: auto;
        z-index: 100;
        padding-top: 0;
      }
      .sidebar .search-box {
        padding: 15px;
        background-color: #495057;
        margin-top: 0;
      }
      .sidebar .nav-section {
        margin-top: 10px;
      }
      .sidebar .section-title {
        padding: 10px 15px;
        font-weight: bold;
        font-size: 0.9rem;
        text-transform: uppercase;
        background-color: #495057;
        margin-top: 10px;
      }
      .sidebar .nav-link {
        color: #dee2e6;
        padding: 10px 15px;
        display: block;
        text-decoration: none;
        transition: all 0.3s;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        background-color: #495057;
        color: white;
      }
      .main-content {
        margin-left: 250px;
        margin-top: 0;
        padding: 20px;
      }
      .product-card {
        height: 100%;
        transition: transform 0.2s;
      }
      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      }
      .product-img-wrapper {
        width: 100%;
        height: 200px;
        overflow: hidden;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .product-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Search -->
      <div class="search-box">
        <form action="/products" method="get">
          <div class="input-group input-group-sm">
            <input type="text" name="q" class="form-control" placeholder="Tìm sản phẩm..." th:value="${q}">
            <button class="btn btn-success" type="submit">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
      </div>

      <!-- Top 20 Section -->
      <div class="section-title">
        <i class="bi bi-star-fill text-warning"></i> TOP 20
      </div>
      <a href="/user/top20?type=new" class="nav-link">
        <i class="bi bi-lightning-fill text-danger"></i> Sản phẩm mới
      </a>
      <a href="/user/top20?type=bestselling" class="nav-link">
        <i class="bi bi-fire text-danger"></i> Bán chạy nhất
      </a>
      <a href="/user/top20?type=mostfavorited" class="nav-link">
        <i class="bi bi-heart-fill text-danger"></i> Yêu thích nhất
      </a>

      <!-- Categories Section -->
      <div class="section-title">
        <i class="bi bi-grid-3x3-gap"></i> DANH MỤC
      </div>
      <a href="/user/products" class="nav-link" th:classappend="${categoryId == null && q == null} ? 'active'">
        <i class="bi bi-grid"></i> Tất cả sản phẩm
      </a>
      <a th:each="cat : ${categories}" 
         th:href="@{/user/products(category=${cat.id})}" 
         class="nav-link"
         th:classappend="${categoryId == cat.id} ? 'active'"
         th:text="${cat.name}">
        Category
      </a>
    </div>

    <!-- Main content -->
    <div class="main-content">
      <h4 class="mb-4">
        <span th:if="${q != null}" th:text="'Kết quả tìm kiếm: ' + ${q}">Kết quả tìm kiếm</span>
        <span th:if="${selectedCategory != null}" th:text="${selectedCategory.name}">Danh mục</span>
        <span th:if="${q == null && selectedCategory == null}">Tất cả sản phẩm</span>
      </h4>

      <!-- Trạng thái rỗng -->
      <div th:if="${products == null || products.size() == 0}" class="text-center py-5">
        <i class="bi bi-inbox" style="font-size: 4rem; color: #dee2e6"></i>
        <p class="text-muted mt-3">Chưa có sản phẩm</p>
      </div>

      <!-- Grid 4 cột với khung ảnh cố định -->
      <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4" th:if="${products != null && products.size() > 0}">
        <div class="col" th:each="p : ${products}">
          <div class="card product-card h-100">
            <a th:href="@{'/user/product/' + ${p.id}}" class="text-decoration-none text-dark">
              <div class="product-img-wrapper">
                <img th:if="${p.imageUrl} != null"
                     th:src="${p.imageUrl}"
                     th:alt="${p.name}"
                     class="product-img"/>
                <img th:if="${p.imageUrl} == null" 
                     src="/images/no-image.png" 
                     alt="No image" 
                     class="product-img"/>
              </div>
              <div class="card-body">
                <h6 class="card-title" th:text="${p.name}">Tên sản phẩm</h6>
                <p class="text-danger fw-bold mb-0" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</p>
              </div>
            </a>
          </div>
        </div>
      </div>

      <!-- Phân trang -->
      <nav class="d-flex justify-content-center mt-4" th:if="${totalPages > 1}">
        <ul class="pagination">
          <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/user/products(page=${currentPage - 1}, q=${q}, category=${categoryId})}">Trước</a>
          </li>
          <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/user/products(page=${i}, q=${q}, category=${categoryId})}" th:text="${i + 1}">1</a>
          </li>
          <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
            <a class="page-link" th:href="@{/user/products(page=${currentPage + 1}, q=${q}, category=${categoryId})}">Sau</a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
