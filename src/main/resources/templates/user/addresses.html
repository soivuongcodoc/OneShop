<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Quản lý địa chỉ - OneShop</title>
  </head>
  <body>
    <div class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4><i class="bi bi-geo-alt"></i> Quản lý địa chỉ nhận hàng</h4>
        <a class="btn btn-outline-secondary" th:href="@{/user/dashboard}">
          <i class="bi bi-arrow-left"></i> Quay lại
        </a>
      </div>

      <!-- Form thêm địa chỉ mới -->
      <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Thêm địa chỉ mới</h5>
        </div>
        <div class="card-body">
          <form th:action="@{/user/addresses}" method="post">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Họ tên người nhận <span class="text-danger">*</span></label>
                <input name="name" class="form-control" placeholder="Nhập họ tên" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Địa chỉ chi tiết <span class="text-danger">*</span></label>
                <input name="address" class="form-control" placeholder="Nhập địa chỉ đầy đủ" required />
              </div>
              <div class="col-md-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="isDefault" id="isDefaultCheck" value="true" />
                  <label class="form-check-label" for="isDefaultCheck">Đặt làm địa chỉ mặc định</label>
                </div>
              </div>
              <div class="col-md-12">
                <button type="submit" class="btn btn-primary">
                  <i class="bi bi-save"></i> Lưu địa chỉ
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Danh sách địa chỉ -->
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h5 class="mb-0"><i class="bi bi-list"></i> Danh sách địa chỉ</h5>
        </div>
        <div class="card-body">
          <div th:if="${addresses == null or #lists.isEmpty(addresses)}" class="text-center text-muted py-4">
            <i class="bi bi-inbox" style="font-size: 3rem"></i>
            <p class="mt-2">Chưa có địa chỉ nào. Vui lòng thêm địa chỉ ở trên.</p>
          </div>

          <div th:if="${addresses != null and !#lists.isEmpty(addresses)}">
            <div th:each="a : ${addresses}" class="border rounded p-3 mb-3" th:classappend="${a.isDefault} ? 'border-primary bg-light' : ''">
              <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1">
                  <h6 class="fw-bold mb-1">
                    <i class="bi bi-person-fill text-primary"></i> <span th:text="${a.name}">Tên</span>
                    <span th:if="${a.isDefault}" class="badge bg-primary ms-2">Mặc định</span>
                  </h6>
                  <p class="mb-0 text-muted">
                    <i class="bi bi-geo-alt-fill text-danger"></i> <span th:text="${a.address}">Địa chỉ</span>
                  </p>
                </div>
                <div class="btn-group-vertical" role="group">
                  <form th:if="${!a.isDefault}" th:action="@{'/user/addresses/' + ${a.id} + '/set-default'}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-primary">
                      <i class="bi bi-star"></i> Đặt mặc định
                    </button>
                  </form>
                  <form th:action="@{'/user/addresses/' + ${a.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc muốn xóa địa chỉ này?')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                      <i class="bi bi-trash"></i> Xóa
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
