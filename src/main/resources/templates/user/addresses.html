<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Địa chỉ của tôi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container my-4">
      <h3>Địa chỉ nhận hàng</h3>
      <form class="row g-2" th:action="@{/user/addresses}" method="post">
        <div class="col-md-3">
          <input
            name="name"
            class="form-control"
            placeholder="Họ tên"
            required
          />
        </div>
        <div class="col-md-3">
          <input
            name="phone"
            class="form-control"
            placeholder="Số điện thoại"
            required
          />
        </div>
        <div class="col-md-4">
          <input
            name="address"
            class="form-control"
            placeholder="Địa chỉ"
            required
          />
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100">Thêm</button>
        </div>
      </form>
      <hr />
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Họ tên</th>
            <th>Điện thoại</th>
            <th>Địa chỉ</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="a : ${addresses}">
            <td th:text="${a.name}"></td>
            <td th:text="${a.phone}"></td>
            <td th:text="${a.address}"></td>
            <td>
              <form
                th:action="@{'/user/addresses/' + ${a.id} + '/delete'}"
                method="post"
              >
                <button class="btn btn-sm btn-outline-danger">Xóa</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
      <a class="btn btn-secondary" th:href="@{/user/profile}">Quay lại hồ sơ</a>
    </div>
  </body>
</html>
