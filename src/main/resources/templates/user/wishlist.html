<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Sản phẩm yêu thích</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container my-4">
      <h3>Danh sách yêu thích</h3>
      <div class="row" th:if="${#lists.isEmpty(items)}">
        <div class="col-12">Chưa có sản phẩm yêu thích.</div>
      </div>
      <div class="row" th:each="w : ${items}">
        <div class="col-md-8">
          <a
            th:href="@{'/product/' + ${w.product.id}}"
            th:text="${w.product.name}"
          ></a>
        </div>
        <div class="col-md-4 text-end">
          <form
            th:action="@{'/user/wishlist/remove/' + ${w.product.id}}"
            method="post"
          >
            <button class="btn btn-sm btn-outline-danger">Bỏ thích</button>
          </form>
        </div>
      </div>
      <a class="btn btn-secondary mt-3" th:href="@{/}">Tiếp tục mua sắm</a>
      <a class="btn btn-primary mt-3" th:href="@{/user/cart}">Xem giỏ hàng</a>
    </div>
  </body>
</html>
