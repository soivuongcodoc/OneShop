<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Thanh toán</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container my-4">
      <h3>Thanh toán</h3>
      <div th:if="${cart == null || #lists.isEmpty(cart.items)}">
        Giỏ hàng trống.
      </div>
      <div th:if="${cart != null && !#lists.isEmpty(cart.items)}">
        <table class="table">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>SL</th>
              <th>Giá</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="it : ${cart.items}">
              <td th:text="${it.product.name}"></td>
              <td th:text="${it.quantity}"></td>
              <td th:text="${it.product.price}"></td>
            </tr>
          </tbody>
        </table>
        <form th:action="@{/user/checkout}" method="post" class="row g-3">
          <div class="col-12">
            <label class="form-label">Địa chỉ giao hàng</label>
            <input class="form-control" name="shippingAddress" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Phương thức thanh toán</label>
            <select class="form-select" name="payment" required>
              <option
                th:each="pm : ${paymentMethods}"
                th:value="${pm.name}"
                th:text="${pm.displayName}"
              ></option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Mã giảm giá (nếu có)</label>
            <input
              class="form-control"
              name="coupon"
              placeholder="COUPON2025"
            />
          </div>
          <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary">Đặt hàng</button>
            <a class="btn btn-secondary" th:href="@{/user/cart}"
              >Quay lại giỏ hàng</a
            >
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
