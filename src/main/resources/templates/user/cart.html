<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Giỏ hàng - OneShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      @media (max-width: 768px) {
        .d-flex.justify-content-between {
          flex-direction: column;
          align-items: flex-start !important;
        }
        .d-flex.justify-content-between h2 {
          margin-bottom: 1rem !important;
        }
        .d-flex.justify-content-between .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Giỏ hàng của bạn</h2>
        <a href="/user/dashboard" class="btn btn-outline-primary">
          <i class="fas fa-arrow-left me-2"></i>Quay lại Dashboard
        </a>
      </div>

      <div th:if="${#lists.isEmpty(cart)}">
        <div class="alert alert-info">
          Giỏ hàng trống. <a th:href="@{/products}">Tiếp tục mua sắm</a>
        </div>
      </div>

      <div th:if="${!#lists.isEmpty(cart)}">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th class="text-center">Số lượng</th>
              <th class="text-end">Giá (VNĐ)</th>
              <th class="text-end">Thành tiền</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="it : ${cart}">
              <td>
                <div class="d-flex align-items-center">
                  <img
                    th:src="@{'/uploads/products/' + ${it.productId} + '.png'}"
                    alt="img"
                    onerror="this.src='/static/images/no-image.png'"
                    style="width: 64px; height: 64px; object-fit: cover"
                    class="me-3"
                  />
                  <div>
                    <a
                      th:href="@{/product/{id}(id=${it.productId})}"
                      th:text="${it.name}"
                      >Product name</a
                    >
                  </div>
                </div>
              </td>
              <td class="text-center" th:text="${it.quantity}">1</td>
              <td
                class="text-end"
                th:text="${#numbers.formatDecimal(it.price,0,'COMMA',0,'POINT')}"
              >
                0
              </td>
              <td
                class="text-end"
                th:text="${#numbers.formatDecimal(it.price * it.quantity,0,'COMMA',0,'POINT')}"
              >
                0
              </td>
              <td class="text-end">
                <form
                  th:action="@{/user/cart/remove/{id}(id=${it.productId})}"
                  method="post"
                  th:object="${it}"
                >
                  <button class="btn btn-sm btn-outline-danger" type="submit">
                    Xóa
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td></td>
              <td></td>
              <td class="text-end fw-bold">Tổng</td>
              <td
                class="text-end fw-bold"
                th:text="${#numbers.formatDecimal(totalAmount,0,'COMMA',0,'POINT')} + ' VNĐ'"
              >
                0 VNĐ
              </td>
              <td></td>
            </tr>
          </tfoot>
        </table>

        <div class="d-flex justify-content-between">
          <a th:href="@{/products}" class="btn btn-outline-secondary"
            >Tiếp tục mua sắm</a
          >
          <a th:href="@{/user/checkout}" class="btn btn-primary">Thanh toán</a>
        </div>
      </div>
    </div>
  </body>
</html>
