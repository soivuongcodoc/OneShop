<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Hồ sơ - OneShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      .address-card {
        transition: all 0.3s;
        border-left: 4px solid transparent;
      }
      .address-card:hover {
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .address-card.default {
        border-left-color: #0d6efd;
        background-color: #f8f9fa;
      }
      .badge-default {
        background-color: #0d6efd;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-person-circle"></i> Hồ sơ của tôi</h2>
        <a th:href="@{/user/dashboard}" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Quay lại Dashboard
        </a>
      </div>

      <div class="row">
        <!-- Left Column: Thông tin cá nhân -->
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">
                <i class="bi bi-person-badge"></i> Thông tin tài khoản
              </h5>
            </div>
            <div class="card-body">
              <form th:action="@{/user/profile/update}" method="post">
                <div class="mb-3">
                  <label class="form-label fw-bold"
                    ><i class="bi bi-person"></i> Tên đăng nhập</label
                  >
                  <input
                    type="text"
                    readonly
                    class="form-control-plaintext"
                    th:value="${user.username}"
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold"
                    ><i class="bi bi-envelope"></i> Email</label
                  >
                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    th:value="${user.email}"
                    required
                  />
                </div>

                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check-circle"></i> Cập nhật thông tin
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Right Column: Quản lý địa chỉ -->
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div
              class="card-header bg-success text-white d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0">
                <i class="bi bi-geo-alt"></i> Địa chỉ nhận hàng
              </h5>
              <button
                class="btn btn-light btn-sm"
                data-bs-toggle="modal"
                data-bs-target="#addAddressModal"
              >
                <i class="bi bi-plus-circle"></i> Thêm địa chỉ mới
              </button>
            </div>
            <div class="card-body">
              <!-- Danh sách địa chỉ -->
              <div
                th:if="${addresses == null or #lists.isEmpty(addresses)}"
                class="text-center text-muted py-5"
              >
                <i class="bi bi-inbox" style="font-size: 3rem"></i>
                <p class="mt-3">Bạn chưa có địa chỉ nhận hàng nào.</p>
                <button
                  class="btn btn-primary"
                  data-bs-toggle="modal"
                  data-bs-target="#addAddressModal"
                >
                  <i class="bi bi-plus-circle"></i> Thêm địa chỉ đầu tiên
                </button>
              </div>

              <div th:if="${addresses != null and !#lists.isEmpty(addresses)}">
                <div
                  th:each="addr : ${addresses}"
                  class="card address-card mb-3"
                  th:classappend="${addr.isDefault} ? 'default' : ''"
                >
                  <div class="card-body">
                    <div
                      class="d-flex justify-content-between align-items-start"
                    >
                      <div class="flex-grow-1">
                        <h6 class="fw-bold mb-1">
                          <i class="bi bi-person-fill text-primary"></i>
                          <span th:text="${addr.name}">Tên người nhận</span>
                          <span
                            th:if="${addr.isDefault}"
                            class="badge badge-default ms-2"
                          >
                            <i class="bi bi-check-circle"></i> Mặc định
                          </span>
                        </h6>
                        <p class="mb-1">
                          <i class="bi bi-telephone-fill text-success"></i>
                          <span th:text="${addr.phone}">0123456789</span>
                        </p>
                        <p class="mb-0 text-muted">
                          <i class="bi bi-geo-alt-fill text-danger"></i>
                          <span th:text="${addr.address}"
                            >Địa chỉ chi tiết</span
                          >
                        </p>
                      </div>
                      <div class="btn-group-vertical" role="group">
                        <button
                          th:if="${!addr.isDefault}"
                          class="btn btn-sm btn-outline-primary"
                          th:onclick="'setDefaultAddress(' + ${addr.id} + ')'"
                        >
                          <i class="bi bi-star"></i> Đặt mặc định
                        </button>
                        <button
                          class="btn btn-sm btn-outline-danger"
                          th:onclick="'deleteAddress(' + ${addr.id} + ')'"
                        >
                          <i class="bi bi-trash"></i> Xóa
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal: Thêm địa chỉ mới -->
    <div
      class="modal fade"
      id="addAddressModal"
      tabindex="-1"
      aria-labelledby="addAddressModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form th:action="@{/user/addresses}" method="post">
            <div class="modal-header">
              <h5 class="modal-title" id="addAddressModalLabel">
                <i class="bi bi-plus-circle"></i> Thêm địa chỉ mới
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label fw-bold"
                  >Họ tên người nhận <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  name="name"
                  placeholder="Ví dụ: Nguyễn Văn A"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold"
                  >Số điện thoại <span class="text-danger">*</span></label
                >
                <input
                  type="tel"
                  class="form-control"
                  name="phone"
                  placeholder="Ví dụ: 0912345678"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold"
                  >Địa chỉ chi tiết <span class="text-danger">*</span></label
                >
                <textarea
                  class="form-control"
                  name="address"
                  rows="3"
                  placeholder="Ví dụ: Số 123, Đường ABC, Phường XYZ, Quận DEF, TP. HCM"
                  required
                ></textarea>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="isDefault"
                  id="isDefaultCheck"
                  value="true"
                />
                <label class="form-check-label" for="isDefaultCheck">
                  Đặt làm địa chỉ mặc định
                </label>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Hủy
              </button>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Lưu địa chỉ
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function setDefaultAddress(id) {
        if (confirm('Đặt địa chỉ này làm mặc định?')) {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = '/user/addresses/' + id + '/set-default';
          document.body.appendChild(form);
          form.submit();
        }
      }

      function deleteAddress(id) {
        if (confirm('Bạn có chắc muốn xóa địa chỉ này?')) {
          const form = document.createElement('form');
          form.method = 'POST';
          form.action = '/user/addresses/' + id + '/delete';
          document.body.appendChild(form);
          form.submit();
        }
      }
    </script>
  </body>
</html>
