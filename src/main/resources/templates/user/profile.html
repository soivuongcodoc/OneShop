<!DOCTYPE html>
<%@ page contentType="text/html; charset=UTF-8" pageEncoding="UTF-8" %>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <title>Thông tin tài khoản - OneShop</title>
  </head>
  <body>
    <div class="container my-4">
      <h4 class="mb-4"><i class="bi bi-person-circle"></i> Thông tin tài khoản</h4>

      <div class="row">
        <!-- Thông tin cá nhân -->
        <div class="col-md-6 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0"><i class="bi bi-person-badge"></i> Thông tin cơ bản</h5>
            </div>
            <div class="card-body">
              <form th:action="@{/user/profile/update}" method="post">
                <div class="mb-3">
                  <label class="form-label fw-bold">Tên đăng nhập</label>
                  <input type="text" readonly class="form-control-plaintext" th:value="${user.username}" />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Email</label>
                  <input type="email" name="email" class="form-control" th:value="${user.email}" required />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Họ và tên</label>
                  <input type="text" name="fullName" class="form-control" th:value="${customer?.fullName}" required />
                </div>
                <div class="mb-3">
                  <label class="form-label fw-bold">Số điện thoại</label>
                  <input type="text" name="phone" class="form-control" th:value="${customer?.phone}" />
                </div>
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-check-circle"></i> Cập nhật
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Danh sách địa chỉ -->
        <div class="col-md-6 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
              <h5 class="mb-0"><i class="bi bi-geo-alt"></i> Địa chỉ nhận hàng</h5>
              <a th:href="@{/user/addresses}" class="btn btn-light btn-sm">
                <i class="bi bi-pencil"></i> Quản lý địa chỉ
              </a>
            </div>
            <div class="card-body">
              <div th:if="${addresses == null or #lists.isEmpty(addresses)}" class="text-center text-muted py-3">
                <i class="bi bi-inbox" style="font-size: 2rem"></i>
                <p class="mt-2 mb-0">Chưa có địa chỉ nhận hàng</p>
                <a th:href="@{/user/addresses}" class="btn btn-sm btn-primary mt-2">Thêm địa chỉ</a>
              </div>

              <div th:if="${addresses != null and !#lists.isEmpty(addresses)}">
                <div th:each="addr : ${addresses}" class="border rounded p-2 mb-2" th:classappend="${addr.isDefault} ? 'border-primary bg-light' : ''">
                  <div class="d-flex justify-content-between align-items-start">
                    <div>
                      <strong th:text="${addr.name}">Tên</strong>
                      <span th:if="${addr.isDefault}" class="badge bg-primary ms-1">Mặc định</span>
                      <p class="mb-0 text-muted small" th:text="${addr.address}">Địa chỉ</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
