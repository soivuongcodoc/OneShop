<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
      sitemesh:decorate="~{decorators/user-layout}">
<head>
    <title>Trạng thái yêu cầu - OneShop</title>
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <i class="bi bi-hourglass-split text-warning" style="font-size: 5rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-3">Yêu cầu đang chờ duyệt</h2>
                    <p class="text-muted mb-4">Yêu cầu mở shop của bạn đang được admin xem xét. Vui lòng chờ thông báo qua email.</p>
                    
                    <div class="card bg-light border-0 mb-4">
                        <div class="card-body text-start">
                            <h5 class="fw-bold mb-3">Thông tin yêu cầu:</h5>
                            <div class="row mb-2">
                                <div class="col-5 text-muted">Tên shop:</div>
                                <div class="col-7 fw-bold" th:text="${pendingRequest.shopName}">Shop ABC</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-5 text-muted">Địa chỉ:</div>
                                <div class="col-7" th:text="${pendingRequest.address}">Hà Nội</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-5 text-muted">Số điện thoại:</div>
                                <div class="col-7" th:text="${pendingRequest.phone}">0123456789</div>
                            </div>
                            <div class="row">
                                <div class="col-5 text-muted">Ngày gửi:</div>
                                <div class="col-7" th:text="${#temporals.format(pendingRequest.requestDate, 'dd/MM/yyyy HH:mm')}">01/01/2025</div>
                            </div>
                        </div>
                    </div>
                    
                    <a th:href="@{/user/dashboard}" class="btn btn-primary">
                        <i class="bi bi-arrow-left"></i> Quay lại trang chủ
                    </a>
                </div>
            </div>
            
        </div>
    </div>
</div>
</body>
</html>
