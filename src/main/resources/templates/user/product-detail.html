<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
  sitemesh:decorate="~{decorators/user-layout}"
>
  <head>
    <meta charset="UTF-8" />
    <title th:text="${product.name} + ' - OneShop'">Chi tiết sản phẩm - OneShop</title>
    <style>
      .product-detail-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 30px 15px;
      }
      
      .product-image-main {
        width: 100%;
        height: 500px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid #dee2e6;
      }
      
      .product-info {
        padding: 20px;
      }
      
      .product-name {
        font-size: 2rem;
        font-weight: bold;
        color: #212529;
        margin-bottom: 15px;
      }
      
      .product-price {
        font-size: 2.5rem;
        color: #dc3545;
        font-weight: bold;
        margin-bottom: 20px;
      }
      
      .product-stats {
        display: flex;
        gap: 30px;
        margin-bottom: 20px;
        padding: 15px 0;
        border-top: 1px solid #dee2e6;
        border-bottom: 1px solid #dee2e6;
      }
      
      .stat-item {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #6c757d;
      }
      
      .stat-item i {
        font-size: 1.2rem;
      }
      
      .stat-item .value {
        font-weight: 600;
        color: #212529;
      }
      
      .product-description {
        margin: 30px 0;
      }
      
      .product-description h5 {
        font-weight: bold;
        margin-bottom: 15px;
        color: #343a40;
      }
      
      .product-description p {
        color: #495057;
        line-height: 1.8;
        white-space: pre-wrap;
      }
      
      .quantity-selector {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      
      .quantity-btn {
        width: 40px;
        height: 40px;
        border: 1px solid #dee2e6;
        background: white;
        cursor: pointer;
        font-size: 1.2rem;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .quantity-btn:hover {
        background: #f8f9fa;
      }
      
      .quantity-input {
        width: 80px;
        height: 40px;
        text-align: center;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        font-size: 1.1rem;
        font-weight: 600;
      }
      
      .action-buttons {
        display: flex;
        gap: 15px;
        margin-bottom: 30px;
      }
      
      .btn-add-cart, .btn-buy-now {
        flex: 1;
        height: 50px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      
      .btn-add-cart {
        background: white;
        border: 2px solid #28a745;
        color: #28a745;
      }
      
      .btn-add-cart:hover {
        background: #28a745;
        color: white;
      }
      
      .btn-buy-now {
        background: #dc3545;
        border: 2px solid #dc3545;
        color: white;
      }
      
      .btn-buy-now:hover {
        background: #c82333;
        border-color: #c82333;
      }
      
      .btn-wishlist {
        width: 50px;
        height: 50px;
        border: 2px solid #ffc107;
        background: white;
        color: #ffc107;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      
      .btn-wishlist:hover {
        background: #ffc107;
        color: white;
      }
      
      .reviews-section {
        margin-top: 50px;
        padding-top: 30px;
        border-top: 2px solid #dee2e6;
      }
      
      .reviews-section h4 {
        font-weight: bold;
        margin-bottom: 30px;
      }
      
      .review-item {
        padding: 20px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        margin-bottom: 20px;
        background: #f8f9fa;
      }
      
      .review-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      
      .review-user {
        font-weight: 600;
        color: #212529;
      }
      
      .review-date {
        color: #6c757d;
        font-size: 0.9rem;
      }
      
      .review-rating {
        color: #ffc107;
        margin-bottom: 10px;
      }
      
      .review-comment {
        color: #495057;
        line-height: 1.6;
      }
      
      .stock-status {
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 20px;
      }
      
      .stock-status.in-stock {
        background: #d4edda;
        color: #155724;
      }
      
      .stock-status.out-of-stock {
        background: #f8d7da;
        color: #721c24;
      }
      
      .category-badge {
        display: inline-block;
        padding: 6px 12px;
        background: #007bff;
        color: white;
        border-radius: 4px;
        font-size: 0.9rem;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="product-detail-container">
      <div class="row">
        <!-- Product Image -->
        <div class="col-md-6">
          <img 
            th:if="${product.imageUrl != null}"
            th:src="${product.imageUrl}" 
            th:alt="${product.name}"
            class="product-image-main"
          />
          <img 
            th:if="${product.imageUrl == null}"
            src="/images/no-image.png" 
            alt="No image"
            class="product-image-main"
          />
        </div>
        
        <!-- Product Info -->
        <div class="col-md-6">
          <div class="product-info">
            <!-- Category Badge -->
            <span class="category-badge" th:text="${product.category?.name}">
              Danh mục
            </span>
            
            <!-- Product Name -->
            <h1 class="product-name" th:text="${product.name}">Tên sản phẩm</h1>
            
            <!-- Product Stats -->
            <div class="product-stats">
              <div class="stat-item">
                <i class="bi bi-star-fill text-warning"></i>
                <span class="value">4.5</span>
                <span>(120 đánh giá)</span>
              </div>
              <div class="stat-item">
                <i class="bi bi-bag-check text-success"></i>
                <span>Đã bán: <span class="value" th:text="${product.sold}">0</span></span>
              </div>
            </div>
            
            <!-- Price -->
            <div class="product-price">
              <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">0₫</span>
            </div>
            
            <!-- Stock Status -->
            <div th:if="${product.stock > 0}" class="stock-status in-stock">
              <i class="bi bi-check-circle"></i> Còn hàng: 
              <span th:text="${product.stock}">0</span> sản phẩm
            </div>
            <div th:if="${product.stock <= 0}" class="stock-status out-of-stock">
              <i class="bi bi-x-circle"></i> Hết hàng
            </div>
            
            <!-- Quantity Selector -->
            <div class="quantity-selector">
              <label style="font-weight: 600; margin-right: 10px;">Số lượng:</label>
              <button class="quantity-btn" onclick="decreaseQty()">
                <i class="bi bi-dash"></i>
              </button>
              <input type="number" id="quantity" class="quantity-input" value="1" min="1" th:max="${product.stock}">
              <button class="quantity-btn" onclick="increaseQty()">
                <i class="bi bi-plus"></i>
              </button>
            </div>
            
            <!-- Action Buttons -->
            <div class="action-buttons">
              <button class="btn btn-add-cart" onclick="addToCart()" th:disabled="${product.stock <= 0}">
                <i class="bi bi-cart-plus"></i>
                Thêm vào giỏ hàng
              </button>
              <button class="btn btn-buy-now" onclick="buyNow()" th:disabled="${product.stock <= 0}">
                <i class="bi bi-lightning-fill"></i>
                Mua ngay
              </button>
              <button class="btn-wishlist" onclick="addToWishlist()">
                <i class="bi bi-heart"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Product Description -->
      <div class="row mt-4">
        <div class="col-12">
          <div class="product-description">
            <h5><i class="bi bi-file-text"></i> Mô tả sản phẩm</h5>
            <p th:text="${product.description}" th:if="${product.description != null}">
              Mô tả sản phẩm sẽ hiển thị ở đây...
            </p>
            <p th:if="${product.description == null}" class="text-muted fst-italic">
              Chưa có mô tả cho sản phẩm này.
            </p>
          </div>
        </div>
      </div>
      
      <!-- Reviews Section -->
      <div class="reviews-section">
        <h4><i class="bi bi-chat-left-text"></i> Đánh giá sản phẩm</h4>
        
        <!-- Empty Reviews State -->
        <div th:if="${reviews == null || reviews.isEmpty()}" class="text-center py-5">
          <i class="bi bi-chat-dots" style="font-size: 3rem; color: #dee2e6;"></i>
          <p class="text-muted mt-3">Chưa có đánh giá nào cho sản phẩm này</p>
        </div>
        
        <!-- Reviews List -->
        <div th:if="${reviews != null && !reviews.isEmpty()}">
          <div class="review-item" th:each="review : ${reviews}">
            <div class="review-header">
              <span class="review-user" th:text="${review.user?.username ?: 'Người dùng'}">Username</span>
              <span class="review-date" th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2025</span>
            </div>
            
            <div class="review-rating">
              <span th:each="i : ${#numbers.sequence(1, 5)}">
                <i class="bi bi-star-fill" th:if="${i <= review.rating}"></i>
                <i class="bi bi-star" th:if="${i > review.rating}"></i>
              </span>
            </div>
            
            <div class="review-comment" th:text="${review.comment}">
              Nội dung đánh giá...
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script th:inline="javascript">
      const productId = /*[[${product.id}]]*/ 0;
      const maxStock = /*[[${product.stock}]]*/ 0;
      
      function decreaseQty() {
        const input = document.getElementById('quantity');
        const currentValue = parseInt(input.value) || 1;
        if (currentValue > 1) {
          input.value = currentValue - 1;
        }
      }
      
      function increaseQty() {
        const input = document.getElementById('quantity');
        const currentValue = parseInt(input.value) || 1;
        if (currentValue < maxStock) {
          input.value = currentValue + 1;
        }
      }
      
      function addToCart() {
        const qty = document.getElementById('quantity').value;
        
        fetch(`/user/cart/add/${productId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `qty=${qty}`
        })
        .then(response => {
          if (response.ok) {
            alert('Đã thêm sản phẩm vào giỏ hàng!');
          } else {
            alert('Có lỗi xảy ra. Vui lòng thử lại!');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Có lỗi xảy ra. Vui lòng thử lại!');
        });
      }
      
      function buyNow() {
        const qty = document.getElementById('quantity').value;
        
        fetch(`/user/cart/add/${productId}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: `qty=${qty}`
        })
        .then(response => {
          if (response.ok) {
            window.location.href = '/user/cart';
          } else {
            alert('Có lỗi xảy ra. Vui lòng thử lại!');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Có lỗi xảy ra. Vui lòng thử lại!');
        });
      }
      
      function addToWishlist() {
        fetch(`/user/wishlist/add/${productId}`, {
          method: 'POST',
        })
        .then(response => {
          if (response.ok) {
            alert('Đã thêm vào danh sách yêu thích!');
            const btn = event.target.closest('.btn-wishlist');
            btn.style.background = '#ffc107';
            btn.style.color = 'white';
          } else {
            alert('Có lỗi xảy ra. Vui lòng thử lại!');
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Có lỗi xảy ra. Vui lòng thử lại!');
        });
      }
    </script>
  </body>
</html>
