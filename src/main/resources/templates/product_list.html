<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    
    <!-- Google Fonts - Hỗ trợ tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    
    <style>
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
  </head>
  <body>
    <div class="container my-4">
      <div id="product-grid" class="row g-3">
        <div class="col-md-3" th:each="p : ${products}">
          <div class="card h-100">
            <img
              class="card-img-top"
              th:src="${p.imageUrl} != null ? ${p.imageUrl} : '/uploads/user/default.png'"
              alt=""
            />
            <div class="card-body">
              <h6 class="card-title" th:text="${p.name}">Tên SP</h6>
              <div class="text-muted" th:text="${p.price}">0</div>
            </div>
            <div class="card-footer bg-white border-0">
              <a
                class="btn btn-sm btn-primary w-100"
                th:href="@{'/product/' + ${p.id}}"
                >Xem</a
              >
            </div>
          </div>
        </div>
      </div>

      <div class="text-center my-3">
        <button
          id="load-more"
          class="btn btn-outline-primary"
          th:if="${currentPage + 1 < totalPages}"
        >
          Tải thêm
        </button>
      </div>
    </div>

    <script>
      (function () {
        const btn = document.getElementById('load-more');
        if (!btn) return;
        let currentPage = /*[[${currentPage}]]*/ 0;
        const totalPages = /*[[${totalPages}]]*/ 1;
        const grid = document.getElementById('product-grid');

        function buildCard(p) {
          const col = document.createElement('div');
          col.className = 'col-md-3';
          col.innerHTML = `
        <div class="card h-100">
          <img class="card-img-top" src="${
            p.imageUrl || '/uploads/user/default.png'
          }" alt=""/>
          <div class="card-body">
            <h6 class="card-title">${p.name}</h6>
            <div class="text-muted">${p.price}</div>
          </div>
          <div class="card-footer bg-white border-0">
            <a class="btn btn-sm btn-primary w-100" href="/product/${
              p.id
            }">Xem</a>
          </div>
        </div>`;
          return col;
        }

        async function loadMore() {
          if (currentPage + 1 >= totalPages) return;
          currentPage++;
          const url = new URL(window.location.href);
          url.searchParams.set('page', currentPage);
          const res = await fetch(url.toString(), {
            headers: { 'X-Requested-With': 'fetch' },
          });
          const html = await res.text();
          // Giả định server trả lại lại template đầy đủ; lấy products từ JSON sẽ tốt hơn.
          // Ở đây demo: không parse; thực tế khuyến nghị API JSON riêng.
          // Tối giản: dừng ở nút 'Tải thêm' nếu không thể parse.
          location.href = url.toString();
        }

        btn.addEventListener('click', loadMore);

        // Lazy load on scroll
        window.addEventListener('scroll', function () {
          if (
            window.innerHeight + window.scrollY >=
            document.body.offsetHeight - 200
          ) {
            if (currentPage + 1 < totalPages) {
              btn.click();
            }
          }
        });
      })();
    </script>
  </body>
</html>
