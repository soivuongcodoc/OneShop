<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sitemesh="http://www.opensymphony.com/sitemesh/decorator"
  sitemesh:decorate="~{decorators/main}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Danh sách sản phẩm - OneShop</title>
    <style>
      .category-filter {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 30px;
      }
      .category-btn {
        margin: 5px;
        border-radius: 20px;
        padding: 8px 20px;
        border: 2px solid #dee2e6;
        background: white;
        cursor: pointer;
        text-decoration: none;
        color: #495057;
        display: inline-block;
      }
      .category-btn:hover {
        background: #e9ecef;
        border-color: #0d6efd;
        color: #0d6efd;
      }
      .category-btn.active {
        background: #0d6efd;
        color: white;
        border-color: #0d6efd;
      }
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 30px 20px; /* 30px dọc (1cm), 20px ngang */
        row-gap: 40px; /* Khoảng cách giữa các hàng: 40px ≈ 1.5cm */
        margin-bottom: 30px;
      }
      .product-card {
        background: white;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .category-section {
        margin-bottom: 50px;
      }
      .category-title {
        font-size: 22px;
        font-weight: bold;
        color: #495057;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 3px solid #0d6efd;
      }
      .product-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 8px;
        display: block;
      }
      .product-name {
        font-weight: 600;
        margin: 10px 0;
        font-size: 14px;
        height: 40px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .product-price {
        color: #dc3545;
        font-weight: bold;
        font-size: 16px;
        margin: 10px 0;
      }
      .add-cart-form {
        display: flex;
        gap: 5px;
        margin-top: 10px;
      }
      .add-cart-form input {
        width: 60px;
        text-align: center;
      }
      .add-cart-form button {
        flex: 1;
      }
      .badge {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 12px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <!-- Header -->
      <div class="mb-4">
        <h2 class="fw-bold">🛍️ Danh sách sản phẩm</h2>
        <p class="text-muted">Khám phá các sản phẩm mỹ phẩm chất lượng cao</p>
      </div>

      <!-- Search Form -->
      <div class="mb-4">
        <form method="get" th:action="@{/products}" class="row g-2">
          <div class="col-md-10">
            <input
              type="text"
              name="q"
              th:value="${q}"
              class="form-control"
              placeholder="🔍 Tìm kiếm sản phẩm..."
            />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">
              Tìm kiếm
            </button>
          </div>
        </form>
      </div>

      <!-- Category Filter -->
      <div class="category-filter">
        <h5 class="mb-3">📂 Danh mục sản phẩm</h5>
        <div>
          <a
            th:href="@{/products}"
            class="category-btn"
            th:classappend="${categoryId == null && (q == null || q.isEmpty())} ? 'active' : ''"
          >
            Tất cả
          </a>
          <a
            th:each="cat : ${categories}"
            th:href="@{/products(category=${cat.id})}"
            class="category-btn"
            th:classappend="${categoryId != null && categoryId == cat.id} ? 'active' : ''"
            th:text="${cat.name}"
          >
            Category Name
          </a>
        </div>
      </div>

      <!-- Products Grid -->
      <div
        th:if="${products == null || products.size() == 0}"
        class="text-center py-5"
      >
        <i class="bi bi-inbox" style="font-size: 4rem; color: #dee2e6"></i>
        <p class="text-muted mt-3">Không tìm thấy sản phẩm nào</p>
        <a th:href="@{/products}" class="btn btn-primary"
          >Xem tất cả sản phẩm</a
        >
      </div>

      <!-- Hiển thị sản phẩm theo grid với badge category -->
      <div
        class="product-grid"
        th:if="${products != null && products.size() > 0}"
      >
        <div class="product-card" th:each="p : ${products}">
          <!-- Badge danh mục -->
          <div class="mb-2">
            <span class="badge bg-info text-dark" th:text="${p.category.name}">
              Category
            </span>
          </div>

          <a th:href="@{'/product/' + ${p.id}}" class="text-decoration-none">
            <img
              th:if="${p.imageUrl} != null"
              th:src="${p.imageUrl}"
              th:alt="${p.name}"
            />
            <img
              th:if="${p.imageUrl} == null"
              src="/images/no-image.png"
              alt="No image"
            />
            <div class="product-name" th:text="${p.name}">Product Name</div>
          </a>
          <div
            class="product-price"
            th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'"
          >
            0₫
          </div>

          <form
            th:action="@{'/user/cart/add/' + ${p.id}}"
            method="post"
            class="add-cart-form"
          >
            <input
              type="number"
              name="qty"
              value="1"
              min="1"
              class="form-control form-control-sm"
            />
            <button type="submit" class="btn btn-sm btn-success">
              <i class="bi bi-cart-plus"></i> Thêm
            </button>
          </form>
        </div>
      </div>

      <!-- Pagination -->
      <nav
        class="pagination-wrapper d-flex justify-content-center mt-4"
        th:if="${totalPages > 1}"
      >
        <ul class="pagination">
          <li
            class="page-item"
            th:classappend="${currentPage == 0} ? 'disabled'"
          >
            <a
              class="page-link"
              th:href="@{/products(page=${currentPage - 1}, q=${q}, category=${categoryId})}"
            >
              Trước
            </a>
          </li>

          <li
            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            class="page-item"
            th:classappend="${i == currentPage} ? 'active'"
          >
            <a
              class="page-link"
              th:href="@{/products(page=${i}, q=${q}, category=${categoryId})}"
              th:text="${i + 1}"
            >
              1
            </a>
          </li>

          <li
            class="page-item"
            th:classappend="${currentPage >= totalPages - 1} ? 'disabled'"
          >
            <a
              class="page-link"
              th:href="@{/products(page=${currentPage + 1}, q=${q}, category=${categoryId})}"
            >
              Sau
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </body>
</html>
