<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thông tin cửa hàng</title>
</head>
<body>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold mb-0">Thông tin cửa hàng</h2>
    <a th:href="@{/vendor/settings}" class="btn btn-primary">
      <i class="bi bi-pencil-square"></i> Chỉnh sửa thông tin
    </a>
  </div>

  <div class="row" th:if="${shop != null}">
    <!-- Shop Logo -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <div th:if="${shop.logoUrl}" class="mb-3">
            <img th:src="${shop.logoUrl}" alt="Shop Logo" class="img-fluid rounded" style="max-height: 200px;">
          </div>
          <div th:unless="${shop.logoUrl}" class="mb-3">
            <div class="bg-light rounded d-flex align-items-center justify-content-center" style="height: 200px;">
              <i class="bi bi-shop text-muted" style="font-size: 4rem;"></i>
            </div>
          </div>
          <h5 class="card-title mb-1" th:text="${shop.name}">Tên cửa hàng</h5>
          <p class="text-muted small mb-0">
            <i class="bi bi-clock"></i> 
            Tham gia: <span th:text="${#temporals.format(shop.createdAt, 'dd/MM/yyyy')}"></span>
          </p>
        </div>
      </div>
    </div>

    <!-- Shop Details -->
    <div class="col-md-8 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h6 class="mb-0"><i class="bi bi-info-circle"></i> Chi tiết thông tin</h6>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="text-muted small mb-1">Tên cửa hàng</label>
              <p class="fw-semibold" th:text="${shop.name}">-</p>
            </div>
            <div class="col-md-6">
              <label class="text-muted small mb-1">Số điện thoại</label>
              <p class="fw-semibold" th:text="${shop.phone ?: 'Chưa cập nhật'}">-</p>
            </div>
            <div class="col-12">
              <label class="text-muted small mb-1">Địa chỉ</label>
              <p class="fw-semibold" th:text="${shop.address ?: 'Chưa cập nhật'}">-</p>
            </div>
            <div class="col-12">
              <label class="text-muted small mb-1">Mô tả</label>
              <p class="text-muted" th:text="${shop.description ?: 'Chưa có mô tả'}">-</p>
            </div>
            <div class="col-md-6">
              <label class="text-muted small mb-1">Ngày tạo</label>
              <p class="fw-semibold">
                <i class="bi bi-calendar-check text-success"></i>
                <span th:text="${#temporals.format(shop.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
              </p>
            </div>
            <div class="col-md-6" th:if="${shop.updatedAt}">
              <label class="text-muted small mb-1">Cập nhật lần cuối</label>
              <p class="fw-semibold">
                <i class="bi bi-calendar-event text-primary"></i>
                <span th:text="${#temporals.format(shop.updatedAt, 'dd/MM/yyyy HH:mm')}"></span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Account Information -->
  <div class="row" th:if="${user != null}">
    <div class="col-12">
      <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">
          <h6 class="mb-0"><i class="bi bi-person-circle"></i> Thông tin tài khoản</h6>
        </div>
        <div class="card-body">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="text-muted small mb-1">Tên đăng nhập</label>
              <p class="fw-semibold" th:text="${user.username}">-</p>
            </div>
            <div class="col-md-4">
              <label class="text-muted small mb-1">Email</label>
              <p class="fw-semibold" th:text="${user.email}">-</p>
            </div>
            <div class="col-md-4">
              <label class="text-muted small mb-1">Vai trò</label>
              <p>
                <span class="badge bg-info">
                  <i class="bi bi-shop"></i> Vendor
                </span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- No Shop Info -->
  <div th:if="${shop == null}" class="alert alert-warning">
    <i class="bi bi-exclamation-triangle"></i>
    Bạn chưa thiết lập thông tin cửa hàng. 
    <a th:href="@{/vendor/settings}" class="alert-link">Nhấn vào đây để cài đặt</a>
  </div>
</body>
</html>
