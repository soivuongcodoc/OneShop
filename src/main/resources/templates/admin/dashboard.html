<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" sitemesh:decorate="~{decorators/main}">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - OneShop</title>
</head>
<body>
<div class="container mt-5 text-center">
    <h2 class="text-primary">👑 Chào mừng Admin!</h2>
    <p>Đây là khu vực quản trị hệ thống.</p>

    <p class="text-muted">
        Xin chào,
        <span id="who"></span>
        (<span id="role"></span>)
    </p>

    <a href="/logout" class="btn btn-danger mt-3">Đăng xuất</a>
</div>

<script>
// Hiển thị info admin từ localStorage cho vui thôi, không gọi API nữa
const token = localStorage.getItem("jwtToken");
const username = localStorage.getItem("username");
const role = localStorage.getItem("role");

if (!token) {
    // chưa đăng nhập -> quay lại login
    window.location.href = "/login";
} else {
    // set text UI
    document.getElementById("who").textContent = username || "admin";
    document.getElementById("role").textContent = role || "ROLE_ADMIN";
}

// NOTE: KHÔNG fetch /api/admin/dashboard ở đây nữa.
// Không auto chuyển hướng /403 ở đây nữa.
</script>
</body>
</html>
