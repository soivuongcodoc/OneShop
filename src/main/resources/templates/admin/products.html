<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Quản lý Sản phẩm - OneShop Admin</title>
</head>
<body>

<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
  <h4 class="fw-bold text-primary">
    <i class="bi bi-box-seam"></i> Danh sách sản phẩm
  </h4>
  <a th:href="@{/admin/products/new}" class="btn btn-success">
    <i class="bi bi-plus-circle"></i> Thêm sản phẩm
  </a>
</div>

<form th:action="@{/admin/products}" method="get" class="mb-3">
  <div class="input-group" style="max-width:400px;">
    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên sản phẩm...">
    <button class="btn btn-primary"><i class="bi bi-search"></i></button>
  </div>
</form>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-primary text-center">
      <tr>
        <th>ID</th>
        <th>Hình ảnh</th>
        <th>Tên sản phẩm</th>
        <th>Danh mục</th>
        <th>Cửa hàng</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="product : ${products}" class="text-center">
        <td th:text="${product.id}">1</td>
        <td>
          <img th:src="${product.imageUrl ?: '/images/placeholder.png'}"
               alt="Product Image"
               style="width: 50px; height: 50px; object-fit: cover;"
               class="rounded">
        </td>
        <td>
          <strong th:text="${product.name}">Product Name</strong>
        </td>
        <td>
          <span th:text="${product.category?.name ?: 'Chưa phân loại'}">Category</span>
        </td>
        <td th:text="${shopNames[product.shopId] ?: 'N/A'}">Shop Name</td>
        <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">100,000 ₫</td>
        <td th:text="${product.stock}">100</td>
        <td>
          <span th:classappend="${product.active} ? 'badge bg-success' : 'badge bg-danger'"
                th:text="${product.active} ? 'Đang bán' : 'Ngừng bán'">Active</span>
        </td>
        <td>
          <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}"
             class="btn btn-sm btn-outline-primary me-1">
            <i class="bi bi-pencil-square"></i>
          </a>
          <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}"
                method="post"
                class="d-inline"
                onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
