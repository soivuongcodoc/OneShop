<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title th:text="${pageTitle}">Quản lý Sản phẩm - Admin</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold mb-0"><i class="bi bi-box-seam"></i> Quản lý Sản phẩm</h2>
        <a th:href="@{/admin/products/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Thêm sản phẩm mới
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/products}" method="get" class="row g-3 mb-3">
                <div class="col-md-10">
                    <input type="text" name="keyword" class="form-control" placeholder="Tìm kiếm theo tên sản phẩm..." th:value="${keyword}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-secondary w-100"><i class="bi bi-search"></i> Tìm kiếm</button>
                </div>
            </form>
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Hình ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Cửa hàng</th>
                    <th>Giá</th>
                    <th>Tồn kho</th>
                    <th>Trạng thái</th>
                    <th class="text-center">Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td>
                        <img th:src="${product.imageUrl ?: '/images/placeholder.png'}" alt="Product Image"
                             style="width: 50px; height: 50px; object-fit: cover;" class="rounded">
                    </td>
                    <td>
                        <strong th:text="${product.name}">Product Name</strong>
                        <br><small class="text-muted" th:text="${product.category?.name ?: 'Chưa phân loại'}">Category</small>
                    </td>
                    <td>
                        <!-- Lấy tên shop từ Map đã chuẩn bị sẵn -->
                        <span th:text="${shopNames[product.shopId] ?: 'N/A'}">Shop Name</span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">100,000 ₫</td>
                    <td th:text="${product.stock}">100</td>
                    <td>
                        <span th:classappend="${product.active} ? 'badge bg-success' : 'badge bg-danger'"
                              th:text="${product.active} ? 'Đang bán' : 'Ngừng bán'">Active</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}" class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil-square"></i> Sửa
                        </a>
                        <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Xóa
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
