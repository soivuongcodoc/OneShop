<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-primary text-center">
      <tr>
        <th>ID</th>
        <th>Hình ảnh</th>
        <th>Tên sản phẩm</th>
        <th>Danh mục</th>
        <th>Cửa hàng</th>
        <th>Giá</th>
        <th>Tồn kho</th>
        <th>Trạng thái</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="product : ${products}" class="text-center">
        <td th:text="${product.id}">1</td>
        <td>
          <img th:src="${product.imageUrl ?: '/images/placeholder.png'}"
               alt="Product Image"
               style="width: 50px; height: 50px; object-fit: cover;"
               class="rounded">
        </td>
        <td>
          <strong th:text="${product.name}">Product Name</strong>
        </td>
        <td>
          <span th:text="${product.category?.name ?: 'Chưa phân loại'}">Category</span>
        </td>
        <td th:text="${shopNames[product.shopId] ?: 'N/A'}">Shop Name</td>
        <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">100,000 ₫</td>
        <td th:text="${product.stock}">100</td>
        <td>
          <span th:classappend="${product.active} ? 'badge bg-success' : 'badge bg-danger'"
                th:text="${product.active} ? 'Đang bán' : 'Ngừng bán'">Active</span>
        </td>
        <td>
          <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}"
             class="btn btn-sm btn-outline-primary me-1">
            <i class="bi bi-pencil-square"></i>
          </a>
          <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}"
                method="post"
                class="d-inline"
                onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<!-- Pagination -->
<div th:if="${totalPages != null and totalPages > 1}" class="d-flex justify-content-between align-items-center">
  <div>
    <p class="mb-0">Trang <span th:text="${currentPage + 1}">1</span> / <span th:text="${totalPages}">1</span></p>
  </div>

  <nav aria-label="Product pagination">
    <ul class="pagination mb-0">
      <li th:classappend="${currentPage == 0} ? 'disabled' : ''" class="page-item">
        <a class="page-link"
           th:href="@{/admin/products(page=${currentPage - 1}, keyword=${keyword})}"
           th:attr="aria-disabled=${currentPage == 0}">Previous</a>
      </li>

      <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
          th:classappend="${i == currentPage} ? 'active' : ''"
          class="page-item">
        <a class="page-link"
           th:href="@{/admin/products(page=${i}, keyword=${keyword})}"
           th:text="${i + 1}">1</a>
      </li>

      <li th:classappend="${currentPage + 1 >= totalPages} ? 'disabled' : ''" class="page-item">
        <a class="page-link"
           th:href="@{/admin/products(page=${currentPage + 1}, keyword=${keyword})}"
           th:attr="aria-disabled=${currentPage + 1 >= totalPages}">Next</a>
      </li>
    </ul>
  </nav>
</div>

</body>
</html>
