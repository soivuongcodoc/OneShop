<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sitemesh="http://www.opensymphony.com/sitemesh/page">
<head>
  <meta charset="UTF-8">
  <title>Quản lý danh mục - OneShop Admin</title>
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
  <h4 class="fw-bold text-primary"><i class="bi bi-tags"></i> Danh sách danh mục</h4>
  <a th:href="@{/admin/categories/new}" class="btn btn-success">
    <i class="bi bi-plus-circle"></i> Thêm danh mục
  </a>
</div>

<form th:action="@{/admin/categories}" method="get" class="mb-3">
  <div class="input-group" style="max-width:400px;">
    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên danh mục...">
    <button class="btn btn-primary"><i class="bi bi-search"></i></button>
  </div>
</form>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-primary text-center">
      <tr>
        <th>ID</th>
        <th>Tên danh mục</th>
        <th>Mô tả</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="category : ${categories}" class="text-center">
        <td th:text="${category.id}">1</td>
        <td th:text="${category.name}">Skincare</td>
        <td th:text="${category.description}">Các sản phẩm chăm sóc da</td>
        <td>
          <a th:href="@{'/admin/categories/edit/' + ${category.id}}" class="btn btn-sm btn-outline-primary me-1">
            <i class="bi bi-pencil-square"></i>
          </a>
          <a th:href="@{'/admin/categories/delete/' + ${category.id}}" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('Bạn có chắc muốn xóa danh mục này không?')">
            <i class="bi bi-trash"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
