<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sitemesh="http://www.opensymphony.com/sitemesh/page">
<head>
  <meta charset="UTF-8">
  <title th:text="${category.id == null ? 'Thêm danh mục' : 'Chỉnh sửa danh mục'} + ' - OneShop Admin'"></title>
</head>
<body>
<h4 class="fw-bold text-primary mb-4 border-bottom pb-2">
  <i class="bi bi-pencil-square"></i>
  <span th:text="${category.id == null ? 'Thêm danh mục' : 'Chỉnh sửa danh mục'}"></span>
</h4>

<form th:action="@{/admin/categories/save}" th:object="${category}" method="post" class="mx-auto" style="max-width: 600px;">
  <input type="hidden" th:field="*{id}">

  <div class="mb-3">
    <label for="name" class="form-label fw-semibold">Tên danh mục</label>
    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nhập tên danh mục" required>
  </div>

  <div class="mb-3">
    <label for="description" class="form-label fw-semibold">Mô tả</label>
    <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="Mô tả ngắn..."></textarea>
  </div>

  <div class="text-end">
    <a th:href="@{/admin/categories}" class="btn btn-secondary me-2"><i class="bi bi-arrow-left"></i> Quay lại</a>
    <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Lưu</button>
  </div>
</form>
</body>
</html>
