<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${pageTitle}">Xem chi tiết người dùng</title>
</head>
<body>
<div class="container">
  <h4 th:text="${pageTitle}">Xem chi tiết người dùng</h4>

  <div th:object="${form}">
    <div class="mb-3">
      <label class="form-label">Tên đăng nhập</label>
      <input type="text" th:field="*{username}" class="form-control" readonly />
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" th:field="*{email}" class="form-control" readonly />
    </div>

    <!-- <div class="mb-3">
      <label class="form-label">Mật khẩu</label>
      <input type="password" class="form-control" value="********" disabled />
    </div> -->

    <div class="mb-3">
      <label class="form-label">Vai trò</label>
      <div th:each="r : ${roles}">
        <label class="form-check">
          <input class="form-check-input" type="radio" th:value="${r}" name="role" disabled
                 th:checked="${form.roles != null && form.roles.size() > 0} ? ${form.roles[0] == r} : ${r == 'ROLE_USER'}" 
                 />
          <span class="form-check-label" th:text="${r}">ROLE_USER</span>
        </label>
      </div>
    </div>

    <a th:href="@{/admin/users}" class="btn btn-secondary">Quay lại</a>
  </div>
</div>
</body>
</html>
