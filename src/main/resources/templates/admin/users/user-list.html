<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sitemesh="http://www.opensymphony.com/sitemesh/page">
<head>
  <meta charset="UTF-8">
  <title>Quản lý người dùng - OneShop Admin</title>
</head>
<body>
<div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
  <h4 class="fw-bold text-primary"><i class="bi bi-people"></i> Danh sách người dùng</h4>
</div>

<form th:action="@{/admin/users}" method="get" class="mb-3">
  <div class="input-group" style="max-width:400px;">
    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên hoặc email...">
    <button class="btn btn-primary"><i class="bi bi-search"></i></button>
  </div>
</form>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead class="table-primary text-center">
      <tr>
        <th>ID</th>
        <th>Tên người dùng</th>
        <th>Email</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="user : ${users}" class="text-center">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.username}">Nguyễn Văn A</td>
        <td th:text="${user.email}">a@gmail.com</td>
        <td>
          <a th:href="@{'/admin/users/delete/' + ${user.id}}" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('Bạn chắc chắn muốn xóa người dùng này?')">
            <i class="bi bi-trash"></i>
          </a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
