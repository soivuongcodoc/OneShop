<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Khuyến mãi toàn sàn</title>
</head>

<body>
    <div class="container-fluid px-4">
        <h1 class="mt-4">Khuyến mãi toàn sàn</h1>

        <div class="card mb-4">
            <div class="card-body d-flex justify-content-between align-items-center">
                <form th:action="@{/admin/promotions}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" class="form-control" placeholder="Tìm theo tên"
                        th:value="${keyword}" />
                    <button class="btn btn-primary" type="submit">Tìm</button>
                </form>
                <a class="btn btn-success" th:href="@{/admin/promotions/new}">+ Tạo khuyến mãi</a>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header"><i class="fas fa-table me-1"></i> Danh sách</div>
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên</th>
                            <th>Loại</th>
                            <th>Giá trị</th>
                            <th>Bắt đầu</th>
                            <th>Kết thúc</th>
                            <th>Kích hoạt</th>
                            <th class="text-end">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${promotions}">
                            <td th:text="${p.id}">1</td>
                            <td th:text="${p.name}">Khuyến mãi A</td>
                            <td th:text="${p.discountType}">PERCENT</td>
                            <td th:text="${p.discountValue}">10</td>
                            <td th:text="${#temporals.format(p.startTime, 'yyyy-MM-dd HH:mm')}">...</td>
                            <td th:text="${#temporals.format(p.endTime,   'yyyy-MM-dd HH:mm')}">...</td>
                            <td>
                                <span th:text="${p.active} ? 'Đang bật' : 'Tắt'"
                                    th:classappend="${p.active} ? 'badge bg-success' : 'badge bg-secondary'"></span>
                            </td>
                            <td class="text-end">
                                <a class="btn btn-sm btn-primary" th:href="@{|/admin/promotions/${p.id}/edit|}">Sửa</a>
                                <form th:action="@{|/admin/promotions/${p.id}/delete|}" method="post" class="d-inline"
                                    onsubmit="return confirm('Xóa khuyến mãi này?');">
                                    <button class="btn btn-sm btn-danger" type="submit">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(promotions)}">
                            <td colspan="8" class="text-center text-muted">Chưa có khuyến mãi nào</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
