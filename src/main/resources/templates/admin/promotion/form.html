<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${mode=='create'} ? 'Tạo khuyến mãi toàn sàn' : 'Sửa khuyến mãi toàn sàn'">Khuyến mãi</title>
</head>
<body>
  <h2 class="fw-bold mb-3" th:text="${mode=='create'} ? 'Tạo khuyến mãi toàn sàn' : 'Sửa khuyến mãi toàn sàn'"></h2>

  <form th:action="${mode=='create'} 
                    ? @{/admin/promotions} 
                    : @{/admin/promotions/{id}(id=${promotionId})}" 
        method="post">
    <div class="mb-3">
      <label class="form-label">Tên chương trình</label>
      <input type="text" name="name" class="form-control" th:value="${form.name}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Mô tả</label>
      <textarea name="description" class="form-control" rows="3" th:text="${form.description}"></textarea>
    </div>

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Loại giảm</label>
        <select name="discountType" class="form-select">
          <option value="PERCENTAGE" th:selected="${form.discountType?.name()=='PERCENTAGE'}">Phần trăm (%)</option>
          <option value="AMOUNT"     th:selected="${form.discountType?.name()=='AMOUNT'}">Số tiền (VNĐ)</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">Giá trị</label>
        <input type="number" step="0.01" name="discountValue" class="form-control" th:value="${form.discountValue}" required>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-md-4">
        <label class="form-label">Bắt đầu</label>
        <input type="datetime-local" name="startTime" class="form-control"
               th:value="${#temporals.format(form.startTime, 'yyyy-MM-dd''T''HH:mm')}" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Kết thúc</label>
        <input type="datetime-local" name="endTime" class="form-control"
               th:value="${#temporals.format(form.endTime, 'yyyy-MM-dd''T''HH:mm')}" required>
      </div>

      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check">
          <!-- giữ cách bạn đang dùng để đảm bảo checkbox luôn gửi giá trị -->
          <input type="hidden" name="_active" value="on">
          <input class="form-check-input" type="checkbox" name="active" id="activeCheckbox" th:checked="${form.active}">
          <label class="form-check-label" for="activeCheckbox">Kích hoạt</label>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Lưu</button>
      <a th:href="@{/admin/promotions}" class="btn btn-secondary">Huỷ</a>
    </div>
  </form>
</body>
</html>
