<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin-layout}">
<head>
    <title th:text="${pageTitle}">Sản phẩm</title>
</head>
<body>
<div layout:fragment="content">
    <h2 class="fw-bold mb-3" th:text="${mode == 'create'} ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'"></h2>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="${mode == 'create'} ? @{/admin/products} : @{'/admin/products/' + ${productId}}"
                  method="post" enctype="multipart/form-data" th:object="${form}">
                <div class="row g-3">
                    <!-- Shop selection for Admin -->
                    <div class="col-md-6">
                        <label for="shopId" class="form-label">Cửa hàng <span class="text-danger">*</span></label>
                        <select id="shopId" class="form-select" th:field="*{shopId}" required>
                            <option value="">-- Chọn cửa hàng --</option>
                            <option th:each="shop : ${shops}"
                                    th:value="${shop.id}"
                                    th:text="${shop.name}">
                                Shop Name
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="name" class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                        <input type="text" id="name" class="form-control" th:field="*{name}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="categoryId" class="form-label">Danh mục <span class="text-danger">*</span></label>
                        <select id="categoryId" class="form-select" th:field="*{categoryId}" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Danh mục</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="price" class="form-label">Giá <span class="text-danger">*</span></label>
                        <input type="number" id="price" step="1000" min="0" class="form-control" th:field="*{price}" required>
                    </div>

                    <div class="col-md-3">
                        <label for="stock" class="form-label">Tồn kho <span class="text-danger">*</span></label>
                        <input type="number" id="stock" min="0" class="form-control" th:field="*{stock}" required>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label">Mô tả</label>
                        <textarea id="description" class="form-control" rows="4" th:field="*{description}"></textarea>
                    </div>

                    <div class="col-md-6">
                        <label for="image" class="form-label">Hình ảnh</label>
                        <input type="file" id="image" class="form-control" th:field="*{image}" accept="image/*">
                        <div class="mt-2" th:if="${currentImage}">
                            <img th:src="@{${currentImage}}" alt="current" style="max-height: 160px" class="rounded">
                        </div>
                    </div>

                    <div class="col-md-6 align-self-center">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" role="switch" id="active" th:field="*{active}">
                            <label class="form-check-label" for="active">Đang bán</label>
                        </div>
                    </div>
                </div>
                <div class="mt-4 d-flex gap-2">
                    <button class="btn btn-primary" type="submit"><i class="bi" th:classappend="${mode == 'create'} ? 'bi-plus-circle' : 'bi-save'"></i> <span th:text="${mode == 'create'} ? 'Tạo mới' : 'Lưu thay đổi'"></span></button>
                    <a th:href="@{/admin/products}" class="btn btn-secondary">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
